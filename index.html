<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ayoo — лучшая программа лояльности</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Manrope:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Bowlby+One&family=Bagel+Fat+One&family=Archivo+Black&family=Big+Shoulders+Display:wght@700;900&family=Boldonse&family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&display=swap" rel="stylesheet" />
  <style>
/* ayoo landing — design tokens & base */

:root {
  /* Palette — "Dopamine glass" (default, overridden at runtime by tweak) */
  --bg: #E4ECFF;
  --bg-alt: #F1ECFF;
  --ink: #241B4E;
  --pop: #FF4FA3;

  /* Dopamine rainbow — drives the gradient blobs & accents (CSS-only) */
  --pop-2: #7C5CFF;   /* violet */
  --cool: #16C8B8;    /* mint-teal */
  --lilac: #5BC8FF;   /* sky */
  --sun: #FFC24B;     /* amber */
  --tang: #FF7A45;    /* tangerine */

  --white: #FFFFFF;
  --line: color-mix(in srgb, var(--ink) 12%, transparent);

  /* Liquid glass surfaces — enhanced */
  --glass: color-mix(in srgb, #ffffff 32%, transparent);
  --glass-strong: color-mix(in srgb, #ffffff 52%, transparent);
  --glass-edge: rgba(255, 255, 255, 0.72);
  --glass-edge-soft: rgba(255, 255, 255, 0.44);
  --sheen:
    inset 0 1.5px 0 rgba(255, 255, 255, 0.88),
    inset 0 0 0 1px rgba(255, 255, 255, 0.20),
    inset 0 -1px 0 rgba(255, 255, 255, 0.28);

  /* Soft, colored depth shadows (replace hard offset shadows) */
  --shadow-sm: 0 8px 22px -10px color-mix(in srgb, var(--ink) 40%, transparent);
  --shadow-md: 0 22px 48px -18px color-mix(in srgb, var(--ink) 46%, transparent);
  --shadow-lg: 0 40px 80px -26px color-mix(in srgb, var(--ink) 52%, transparent);
  --shadow-pop: 0 18px 40px -14px color-mix(in srgb, var(--pop) 55%, transparent);
  --blur: blur(32px) saturate(1.8);

  /* Type */
  --font-display: "Unbounded", "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, sans-serif;

  /* Geometry */
  --r-sm: 12px;
  --r-md: 22px;
  --r-lg: 36px;
  --r-pill: 999px;

  /* Layout */
  --gutter: clamp(16px, 3vw, 40px);
  --maxw: 1440px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

html {
  background: var(--ink);
}

body {
  font-family: var(--font-body);
  font-weight: 400;
  background:
    radial-gradient(120% 90% at 12% 0%, color-mix(in srgb, var(--lilac) 30%, transparent), transparent 55%),
    radial-gradient(110% 90% at 90% 8%, color-mix(in srgb, var(--pop) 22%, transparent), transparent 52%),
    radial-gradient(120% 100% at 70% 100%, color-mix(in srgb, var(--cool) 22%, transparent), transparent 55%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

/* When the animated background is on, body becomes transparent so the
   fixed lava layer shows through the transparent hero. */
body.has-lava {
  background: transparent;
}

::selection { background: var(--ink); color: var(--bg); }

/* ───────────────────────────────────────────────
   ANIMATED LIQUID GRADIENT BACKGROUND
   ─────────────────────────────────────────────── */
.lava {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  /* Animated shifting base gradient */
  background-color: var(--bg);
  background-image: linear-gradient(
    -45deg,
    color-mix(in srgb, var(--pop-2) 32%, var(--bg)),
    color-mix(in srgb, var(--pop)   28%, var(--bg)),
    color-mix(in srgb, var(--lilac) 34%, var(--bg)),
    color-mix(in srgb, var(--cool)  28%, var(--bg)),
    color-mix(in srgb, var(--sun)   26%, var(--bg))
  );
  background-size: 400% 400%;
  animation: lava-base-flow 18s ease infinite;
}
@keyframes lava-base-flow {
  0%   { background-position: 0%   50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0%   50%; }
}

/* Spinning color-wash overlay for a depth/aurora effect */
.lava::before {
  content: "";
  position: absolute;
  inset: 0;
  transform: scale(1.6);
  transform-origin: center center;
  background: conic-gradient(
    from 0deg at 50% 50%,
    color-mix(in srgb, var(--pop)   48%, transparent),
    color-mix(in srgb, var(--sun)   40%, transparent),
    color-mix(in srgb, var(--pop-2) 44%, transparent),
    color-mix(in srgb, var(--cool)  40%, transparent),
    color-mix(in srgb, var(--lilac) 44%, transparent),
    color-mix(in srgb, var(--pop)   48%, transparent)
  );
  filter: blur(60px);
  opacity: 0.38;
  mix-blend-mode: multiply;
  animation: lava-spin 28s linear infinite;
}
@keyframes lava-spin {
  from { transform: scale(1.6) rotate(0deg); }
  to   { transform: scale(1.6) rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .lava, .lava::before { animation: none !important; }
}
/* ── Organic blobs — multiply blend + shape morphing ───────────────── */
.lava__blob {
  position: absolute;
  filter: blur(44px);
  opacity: 0.82;
  mix-blend-mode: multiply;
  will-change: transform, border-radius;
}
@media (min-width: 900px) {
  .lava__blob { filter: blur(56px); }
}
.lava__blob.b1 {
  width: 56vw; height: 48vw;
  left: -10vw; top: 6vh;
  background: radial-gradient(ellipse at 32% 28%,
    color-mix(in srgb, var(--pop) 55%, #fff),
    var(--pop) 36%,
    color-mix(in srgb, var(--pop-2) 75%, var(--pop)) 62%,
    color-mix(in srgb, var(--pop-2) 40%, transparent) 88%);
  border-radius: 62% 38% 46% 54% / 50% 44% 56% 50%;
  animation: morph1 22s ease-in-out infinite, lava1 26s ease-in-out infinite;
}
.lava__blob.b2 {
  width: 48vw; height: 42vw;
  right: -8vw; top: -6vh;
  background: radial-gradient(ellipse at 44% 38%,
    color-mix(in srgb, var(--pop-2) 50%, #fff),
    var(--pop-2) 40%,
    color-mix(in srgb, var(--lilac) 68%, var(--pop-2)) 66%,
    color-mix(in srgb, var(--lilac) 38%, transparent) 90%);
  border-radius: 42% 58% 54% 46% / 48% 52% 48% 52%;
  animation: morph2 28s ease-in-out infinite, lava2 32s ease-in-out infinite;
}
.lava__blob.b3 {
  width: 46vw; height: 40vw;
  left: 26vw; bottom: -10vh;
  background: radial-gradient(ellipse at 42% 40%,
    color-mix(in srgb, var(--cool) 52%, #fff),
    var(--cool) 42%,
    color-mix(in srgb, var(--lilac) 62%, var(--cool)) 68%,
    color-mix(in srgb, var(--lilac) 35%, transparent) 90%);
  border-radius: 54% 46% 38% 62% / 56% 44% 56% 44%;
  animation: morph3 26s ease-in-out infinite, lava3 30s ease-in-out infinite;
}
.lava__blob.b4 {
  width: 38vw; height: 34vw;
  right: 14vw; bottom: 4vh;
  background: radial-gradient(ellipse at 38% 35%,
    color-mix(in srgb, var(--lilac) 55%, #fff),
    var(--lilac) 44%,
    color-mix(in srgb, var(--pop) 58%, var(--lilac)) 70%,
    color-mix(in srgb, var(--pop) 32%, transparent) 90%);
  border-radius: 46% 54% 62% 38% / 44% 56% 44% 56%;
  animation: morph4 20s ease-in-out infinite, lava4 22s ease-in-out infinite;
}
.lava__blob.b5 {
  width: 36vw; height: 32vw;
  left: 5vw; top: 34vh;
  background: radial-gradient(ellipse at 40% 34%,
    color-mix(in srgb, var(--sun) 58%, #fff),
    var(--sun) 38%,
    color-mix(in srgb, var(--tang) 72%, var(--sun)) 60%,
    color-mix(in srgb, var(--pop) 45%, var(--tang)) 82%,
    transparent 100%);
  border-radius: 58% 42% 50% 50% / 42% 58% 42% 58%;
  animation: morph5 30s ease-in-out infinite, lava5 28s ease-in-out infinite;
}

/* Organic shape morphing */
@keyframes morph1 {
  0%, 100% { border-radius: 62% 38% 46% 54% / 50% 44% 56% 50%; }
  33%      { border-radius: 42% 58% 56% 44% / 44% 56% 44% 56%; }
  66%      { border-radius: 54% 46% 38% 62% / 58% 42% 52% 48%; }
}
@keyframes morph2 {
  0%, 100% { border-radius: 42% 58% 54% 46% / 48% 52% 48% 52%; }
  40%      { border-radius: 60% 40% 44% 56% / 52% 48% 60% 40%; }
  70%      { border-radius: 48% 52% 62% 38% / 44% 56% 50% 50%; }
}
@keyframes morph3 {
  0%, 100% { border-radius: 54% 46% 38% 62% / 56% 44% 56% 44%; }
  35%      { border-radius: 44% 56% 58% 42% / 40% 60% 44% 56%; }
  65%      { border-radius: 62% 38% 44% 56% / 52% 48% 60% 40%; }
}
@keyframes morph4 {
  0%, 100% { border-radius: 46% 54% 62% 38% / 44% 56% 44% 56%; }
  50%      { border-radius: 58% 42% 40% 60% / 56% 44% 52% 48%; }
}
@keyframes morph5 {
  0%, 100% { border-radius: 58% 42% 50% 50% / 42% 58% 42% 58%; }
  45%      { border-radius: 40% 60% 58% 42% / 56% 44% 60% 40%; }
  75%      { border-radius: 52% 48% 42% 58% / 44% 56% 46% 54%; }
}

/* ── Film-grain overlay — animated to simulate grain texture ──────── */
.lava__grain {
  position: absolute;
  inset: -30%;
  z-index: 6;
  pointer-events: none;
  opacity: 0.18;
  mix-blend-mode: overlay;
  filter: url(#blob-grain);
  background: rgba(255, 255, 255, 0.75);
  animation: grain-drift 0.6s steps(3) infinite;
}
@keyframes grain-drift {
  0%   { transform: translate(0,   0)   scale(1.35); }
  33%  { transform: translate(-3%, 2%)  scale(1.35); }
  66%  { transform: translate(2%, -3%)  scale(1.35); }
  100% { transform: translate(0,   0)   scale(1.35); }
}

/* faint sheen / top-light overlay */
.lava::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.28), transparent 55%),
    radial-gradient(100% 60% at 50% 100%, rgba(0,0,0,.04), transparent 60%);
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .lava__blob { animation: none !important; }
  .lava__grain { animation: none !important; }
}
@keyframes lava1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%      { transform: translate(8vw, 14vh) scale(1.18); }
  66%      { transform: translate(-4vw, 6vh) scale(0.92); }
}
@keyframes lava2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  40%      { transform: translate(-10vw, 20vh) scale(1.22); }
  70%      { transform: translate(4vw, 8vh) scale(0.88); }
}
@keyframes lava3 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  35%      { transform: translate(-12vw, -16vh) scale(1.1); }
  65%      { transform: translate(10vw, -6vh) scale(1.25); }
}
@keyframes lava4 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-14vw, -22vh) scale(1.3); }
}
@keyframes lava5 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  45%      { transform: translate(16vw, -10vh) scale(1.2); }
  75%      { transform: translate(6vw, 12vh) scale(0.9); }
}

/* keep all real content above the lava layer */
.nav, .marquee, .section, .footer { position: relative; z-index: 1; }

/* hero is transparent so the lava shows through as the page's hero moment */
body.has-lava .hero { background: transparent; }
body.has-lava .cta-banner { background: transparent; }

/* ── Liquid-glass: nav ─────────────────────────────────────────────── */
body.has-lava .nav {
  background: color-mix(in srgb, var(--bg) 42%, transparent);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--glass-edge);
  box-shadow: 0 1px 0 rgba(255,255,255,.55), var(--shadow-sm);
}

/* ── Liquid-glass: CTA banner ──────────────────────────────────────── */
body.has-lava .cta-banner .container {
  background: color-mix(in srgb, #ffffff 22%, transparent);
  -webkit-backdrop-filter: blur(48px) saturate(2);
  backdrop-filter: blur(48px) saturate(2);
  border: 1px solid var(--glass-edge);
  border-radius: var(--r-lg);
  box-shadow:
    var(--shadow-lg),
    var(--sheen),
    0 0 0 0.5px rgba(255,255,255,.55);
  padding: clamp(48px, 7vw, 90px) clamp(24px, 5vw, 64px);
}

/* ── Liquid-glass: intro overlay ───────────────────────────────────── */
body.has-lava .intro {
  background: color-mix(in srgb, var(--bg) 38%, transparent);
  -webkit-backdrop-filter: blur(48px) saturate(2);
  backdrop-filter: blur(48px) saturate(2);
}

/* ── Liquid-glass: hero sticker ────────────────────────────────────── */
body.has-lava .hero__sticker {
  -webkit-backdrop-filter: blur(40px) saturate(2);
  backdrop-filter: blur(40px) saturate(2);
}

/* sections over lava are transparent to reveal the background */
body.has-lava #cats { background: transparent; }
body.has-lava #faq  { background: color-mix(in srgb, var(--bg-alt) 55%, transparent); }
body.has-lava #faq { -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

/* utility */
.container {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding-inline: var(--gutter);
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 15px;
  border: 1px solid var(--glass-edge);
  border-radius: var(--r-pill);
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--shadow-sm), var(--sheen);
  color: var(--ink);
  white-space: nowrap;
}

.h-display {
  font-family: var(--font-display);
  font-weight: 900;
  line-height: 0.88;
  letter-spacing: -0.03em;
  margin: 0;
  text-wrap: balance;
}

.section {
  position: relative;
  padding-block: clamp(80px, 9vw, 140px);
}

.section + .section {
  border-top: 1px solid var(--line);
}

/* sticker / card base */
.sticker {
  border: 1px solid var(--glass-edge);
  border-radius: var(--r-md);
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--shadow-md), var(--sheen);
  overflow: hidden;
}

/* CTA button — solid ink */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 28px;
  border-radius: var(--r-pill);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.01em;
  border: 1px solid color-mix(in srgb, #fff 22%, transparent);
  background: linear-gradient(160deg, color-mix(in srgb, var(--ink) 84%, #fff), var(--ink));
  color: #fff;
  cursor: pointer;
  box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.22);
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
  white-space: nowrap;
  text-decoration: none;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.22); }
.btn--ghost {
  background: var(--glass);
  color: var(--ink);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--shadow-sm), var(--sheen);
}
.btn--ghost:hover {
  background: var(--glass-strong);
  color: var(--ink);
}
.btn--pop {
  background: linear-gradient(150deg, color-mix(in srgb, var(--pop) 86%, #fff), var(--pop) 52%, var(--pop-2));
  color: #fff;
  border-color: color-mix(in srgb, #fff 30%, transparent);
  box-shadow: var(--shadow-pop), inset 0 1px 0 rgba(255,255,255,.32);
}
.btn .arr { width: 18px; height: 18px; }

/* Marquee */
.marquee {
  display: flex;
  overflow: hidden;
  border-block: 1px solid color-mix(in srgb, #fff 26%, transparent);
  background: linear-gradient(90deg, var(--pop), var(--pop-2) 48%, var(--cool));
  color: #fff;
  box-shadow: var(--shadow-md);
}
.marquee--inverted {
  background: var(--glass-strong);
  color: var(--ink);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-block: 1px solid var(--glass-edge);
  box-shadow: var(--shadow-sm), var(--sheen);
}
.marquee__track {
  display: flex;
  gap: 48px;
  padding-block: 22px;
  white-space: nowrap;
  animation: marquee 28s linear infinite;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(18px, 2.2vw, 28px);
  letter-spacing: -0.01em;
}
.marquee__track > span { display: inline-flex; align-items: center; gap: 48px; }
.marquee__track > span::after {
  content: "✱";
  display: inline-block;
  color: var(--pop);
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* Tilted ticker (Sparkz vibe) */
.tilt-ticker {
  position: absolute;
  left: -10%;
  width: 120%;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(20px, 2.4vw, 34px);
  padding-block: 14px;
  overflow: hidden;
  border-block: 1.5px solid var(--ink);
}
.tilt-ticker__inner {
  display: flex;
  gap: 40px;
  white-space: nowrap;
  animation: marquee 22s linear infinite;
}
.tilt-ticker__inner > span::after {
  content: " ✱ ";
  color: var(--pop);
}

/* Photo placeholder */
.photo {
  position: relative;
  background: linear-gradient(150deg, var(--pop) 0%, var(--pop-2) 52%, var(--cool) 100%);
  display: grid;
  place-items: center;
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.01em;
  overflow: hidden;
  border: 1px solid var(--glass-edge);
}
.photo::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), transparent 50%),
    radial-gradient(circle at 70% 80%, rgba(0,0,0,.18), transparent 55%);
}
.photo > span { position: relative; opacity: .55; }

/* Accordion */
details.faq-item {
  border-top: 1px solid var(--line);
  padding-block: 22px;
}
details.faq-item:last-of-type { border-bottom: 1px solid var(--line); }
details.faq-item summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(20px, 2.2vw, 32px);
  letter-spacing: -0.01em;
  line-height: 1.15;
}
details.faq-item summary::-webkit-details-marker { display: none; }
details.faq-item summary .toggle {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  border-radius: 999px;
  border: 1px solid var(--glass-edge);
  display: grid; place-items: center;
  transition: transform .25s ease, background .15s ease, color .15s ease;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--sheen);
}
details.faq-item[open] summary .toggle {
  transform: rotate(45deg);
  background: linear-gradient(135deg, var(--pop), var(--pop-2));
  color: #fff;
  border-color: transparent;
  box-shadow: var(--shadow-pop);
}
details.faq-item .a {
  margin-top: 14px;
  max-width: 720px;
  font-size: 16px;
  line-height: 1.55;
  opacity: .85;
}

/* Audience switch (pill) */
.audience-switch {
  position: relative;
  display: inline-flex;
  padding: 4px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--sheen);
  border-radius: var(--r-pill);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.audience-switch button {
  position: relative;
  z-index: 1;
  background: transparent;
  border: 0;
  padding: 9px 18px;
  border-radius: var(--r-pill);
  color: var(--ink);
  cursor: pointer;
  transition: color .2s ease;
  font: inherit;
  text-transform: inherit;
  letter-spacing: inherit;
}
.audience-switch button.is-active {
  color: #fff;
}
.audience-switch .audience-switch__pill {
  position: absolute;
  top: 4px; bottom: 4px;
  border-radius: var(--r-pill);
  background: linear-gradient(135deg, var(--pop), var(--pop-2));
  box-shadow: var(--shadow-pop);
  transition: left .35s cubic-bezier(.6,.05,.2,1), width .35s cubic-bezier(.6,.05,.2,1);
  z-index: 0;
}

/* Lang menu */
.lang {
  position: relative;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.06em;
}
.lang__btn {
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--sheen);
  padding: 9px 14px;
  border-radius: var(--r-pill);
  cursor: pointer;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.lang__menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: var(--glass-strong);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-radius: var(--r-md);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 140px;
  z-index: 50;
  box-shadow: var(--shadow-md), var(--sheen);
}
.lang__menu button {
  background: transparent;
  border: 0;
  padding: 10px 12px;
  text-align: left;
  border-radius: var(--r-sm);
  cursor: pointer;
  font: inherit;
  color: var(--ink);
}
.lang__menu button:hover { background: var(--bg); }
.lang__menu button.is-active { background: var(--ink); color: var(--bg); }

/* Intro overlay */
.intro {
  position: fixed; inset: 0;
  z-index: 100;
  background: var(--bg);
  display: grid;
  place-items: center;
  padding: var(--gutter);
  transition: transform .9s cubic-bezier(.7,0,.2,1), opacity .5s ease;
}
.intro.is-leaving {
  transform: translateY(-100%);
}
.intro__inner {
  text-align: center;
  max-width: 1100px;
}
.intro__star {
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 96px);
  color: var(--pop);
  line-height: 1;
  display: inline-block;
  transform-origin: center;
  animation: spin 8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.intro h1 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(56px, 11vw, 180px);
  line-height: 0.86;
  letter-spacing: -0.045em;
  margin: 18px 0 24px;
  text-wrap: balance;
}
.intro h1 .ink2 { color: var(--pop); }
.intro p {
  font-size: clamp(18px, 2.2vw, 26px);
  margin: 0 0 36px;
  max-width: 680px;
  margin-inline: auto;
  line-height: 1.4;
  color: var(--ink);
  opacity: .85;
}

/* Top nav */
.nav {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  border-bottom: 1px solid var(--glass-edge-soft);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
}
.nav__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-block: 14px;
}
.nav__logo {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 28px;
  letter-spacing: -0.04em;
  color: var(--ink);
  text-decoration: none;
  line-height: 1;
  display: inline-flex;
  align-items: baseline;
  gap: 2px;
}
.nav__logo .dot {
  display: inline-block;
  width: 10px; height: 10px;
  background: var(--pop);
  border-radius: 50%;
  margin-left: 4px;
  transform: translateY(-2px);
}
.nav__links {
  display: flex;
  gap: 22px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
}
.nav__links a {
  color: var(--ink);
  text-decoration: none;
  opacity: .8;
  transition: opacity .2s ease;
}
.nav__links a:hover { opacity: 1; }
.nav__right {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Hero */
.hero {
  position: relative;
  padding-top: clamp(40px, 5vw, 80px);
  padding-bottom: 0;
  overflow: hidden;
}
.hero__eyebrow-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: clamp(20px, 3vw, 32px);
}
.hero__wordmark {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(120px, 26vw, 460px);
  line-height: 0.82;
  letter-spacing: -0.06em;
  color: var(--ink);
  margin: 0;
  position: relative;
  z-index: 2;
  text-wrap: nowrap;
}
.hero__wordmark .pop-letter { color: var(--pop); }
.hero__sub-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 32px;
  align-items: end;
  margin-top: clamp(20px, 3vw, 36px);
  padding-bottom: clamp(40px, 6vw, 80px);
}
.hero__sub {
  max-width: 540px;
  font-size: clamp(18px, 1.6vw, 22px);
  line-height: 1.4;
}
.hero__ctas {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.hero__art {
  position: absolute;
  right: var(--gutter);
  top: 18%;
  width: clamp(220px, 28vw, 460px);
  aspect-ratio: 3 / 4;
  border-radius: var(--r-lg);
  z-index: 1;
  transform: rotate(4deg);
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.45);
}
.hero__sticker {
  position: absolute;
  background: var(--glass-strong);
  color: var(--ink);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--shadow-md), var(--sheen);
  border-radius: var(--r-pill);
  padding: 18px 28px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(16px, 1.6vw, 24px);
  letter-spacing: -0.01em;
  z-index: 3;
  transform: rotate(-6deg);
  top: 60%;
  left: clamp(20px, 8vw, 120px);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.hero__sticker .dot {
  width: 10px; height: 10px;
  background: var(--pop);
  border-radius: 50%;
}

/* HOW IT WORKS — colored grid (Chuckle vibe) */
.how-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-top: clamp(32px, 5vw, 56px);
}
.how-card {
  border: 1px solid var(--glass-edge);
  border-radius: var(--r-lg);
  padding: clamp(24px, 3vw, 40px);
  min-height: 360px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  -webkit-backdrop-filter: blur(36px) saturate(2);
  backdrop-filter: blur(36px) saturate(2);
  box-shadow:
    0 30px 60px -20px color-mix(in srgb, var(--ink) 38%, transparent),
    var(--sheen);
  transition: transform .22s ease, box-shadow .22s ease;
}
.how-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 44px 80px -24px color-mix(in srgb, var(--ink) 48%, transparent), var(--sheen);
}
.how-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,255,255,.22) 0%, transparent 60%);
  pointer-events: none;
}
.how-card:nth-child(1) {
  background: linear-gradient(155deg,
    color-mix(in srgb, var(--pop) 48%, rgba(255,255,255,.55)),
    color-mix(in srgb, var(--pop) 18%, rgba(255,255,255,.25)));
  color: var(--ink);
}
.how-card:nth-child(2) {
  background: linear-gradient(155deg,
    color-mix(in srgb, var(--ink) 72%, rgba(255,255,255,.1)),
    color-mix(in srgb, var(--ink) 44%, transparent));
  color: var(--bg);
  border-color: rgba(255, 255, 255, 0.22);
}
.how-card:nth-child(3) {
  background: linear-gradient(155deg,
    color-mix(in srgb, var(--lilac) 44%, rgba(255,255,255,.5)),
    color-mix(in srgb, var(--cool) 22%, rgba(255,255,255,.28)));
  color: var(--ink);
}
.how-card__n {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(48px, 6vw, 88px);
  line-height: 1;
  letter-spacing: -0.04em;
}
.how-card__t {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(22px, 2.2vw, 32px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-top: 16px;
  text-wrap: balance;
}
.how-card__d {
  font-size: 15px;
  line-height: 1.5;
  margin-top: 14px;
  max-width: 36ch;
  opacity: .85;
}

/* Categories */
.cats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: clamp(32px, 5vw, 48px);
}
.cat {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 22px;
  border: 1px solid var(--glass-edge);
  border-radius: var(--r-pill);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(16px, 1.6vw, 22px);
  background: color-mix(in srgb, #ffffff 28%, transparent);
  color: var(--ink);
  cursor: default;
  -webkit-backdrop-filter: blur(36px) saturate(2);
  backdrop-filter: blur(36px) saturate(2);
  box-shadow:
    0 14px 30px -12px color-mix(in srgb, var(--ink) 30%, transparent),
    inset 0 1px 0 rgba(255, 255, 255, 0.6);
  transition: background .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.cat:hover {
  background: var(--ink);
  color: var(--bg);
  transform: translateY(-3px);
  box-shadow: 0 22px 40px -14px color-mix(in srgb, var(--ink) 55%, transparent);
}
.cat .c {
  font-size: 12px;
  font-weight: 700;
  background: var(--ink);
  color: var(--bg);
  padding: 4px 8px;
  border-radius: var(--r-pill);
  font-family: var(--font-body);
  letter-spacing: 0.04em;
}
.cat:hover .c { background: var(--pop); color: var(--ink); }

/* Places grid */
.places {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-top: clamp(32px, 5vw, 48px);
}
.place {
  border: 1px solid var(--glass-edge);
  border-radius: var(--r-lg);
  background: color-mix(in srgb, #ffffff 24%, transparent);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  -webkit-backdrop-filter: blur(36px) saturate(2);
  backdrop-filter: blur(36px) saturate(2);
  box-shadow:
    0 30px 60px -22px color-mix(in srgb, var(--ink) 36%, transparent),
    var(--sheen);
  transition: transform .2s ease, box-shadow .2s ease;
}
.place:hover {
  transform: translateY(-5px);
  box-shadow:
    0 44px 80px -24px color-mix(in srgb, var(--ink) 48%, transparent),
    var(--sheen);
}
.place__img {
  aspect-ratio: 4 / 3;
  position: relative;
}
.place__img.v1 { background: radial-gradient(120% 120% at 28% 22%, #FFC0DC, var(--pop) 45%, var(--tang) 100%); }
.place__img.v2 { background: radial-gradient(120% 120% at 28% 22%, #CFC2FF, var(--pop-2) 50%, var(--lilac) 100%); }
.place__img.v3 { background: radial-gradient(120% 120% at 28% 22%, #C7FFF4, var(--cool) 50%, var(--lilac) 100%); }
.place__img.v4 { background: radial-gradient(120% 120% at 28% 22%, #C8E6FF, var(--lilac) 48%, var(--pop-2) 100%); }
.place__img.v5 { background: radial-gradient(120% 120% at 28% 22%, #FFE9B8, var(--sun) 48%, var(--pop) 100%); }
.place__img.v6 { background: radial-gradient(120% 120% at 28% 22%, #FFC8E6, var(--pop) 48%, var(--pop-2) 100%); }
.place__img .tag {
  position: absolute;
  top: 14px; left: 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 6px 10px;
  border-radius: var(--r-pill);
}
.place__img .ph {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: rgba(255,255,255,.7);
  text-shadow: 0 2px 8px rgba(0,0,0,.12);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 60px;
  letter-spacing: -0.02em;
}
.place__body {
  padding: 18px 20px 22px;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  flex: 1;
  border-top: 1px solid rgba(255, 255, 255, 0.4);
}
.place__body h3 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(20px, 2vw, 26px);
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin: 0;
}
.place__body .o {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  background: color-mix(in srgb, var(--bg) 60%, transparent);
  border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent);
  padding: 6px 12px;
  border-radius: var(--r-pill);
  white-space: nowrap;
}

/* Stats */
.stats-section {
  background: var(--ink);
  color: var(--bg);
}
.stats-section .eyebrow { color: var(--bg); border-color: var(--bg); }
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  margin-top: clamp(32px, 5vw, 48px);
}
.stat__n {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(64px, 8vw, 130px);
  line-height: 0.9;
  letter-spacing: -0.04em;
}
.stat:nth-child(2n) .stat__n { color: var(--pop); }
.stat__l {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.4;
  opacity: .75;
  border-top: 1px solid color-mix(in srgb, var(--bg) 30%, transparent);
  padding-top: 12px;
}

/* App / partner-portal section */
.app-section {
  background: linear-gradient(135deg, var(--pop), var(--pop-2) 60%, color-mix(in srgb, var(--pop-2) 70%, var(--ink)));
  color: #fff;
}
.app-section .eyebrow { color: #fff; }
.app-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: clamp(40px, 6vw, 80px);
  align-items: center;
  margin-top: clamp(20px, 3vw, 32px);
}
.app-copy h2 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(40px, 5.5vw, 80px);
  line-height: 0.95;
  letter-spacing: -0.035em;
  margin: 16px 0 18px;
  text-wrap: balance;
}
.app-copy p {
  font-size: clamp(16px, 1.4vw, 20px);
  line-height: 1.4;
  margin: 0 0 28px;
  max-width: 48ch;
}
.app-stores {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.app-stores .btn {
  background: var(--glass-strong);
  color: var(--ink);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--shadow-md), var(--sheen);
}
.phone {
  position: relative;
  max-width: 360px;
  margin: 0 auto;
  aspect-ratio: 9 / 19;
  background: var(--ink);
  border-radius: 48px;
  padding: 14px;
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.2);
  border: 1px solid color-mix(in srgb, #fff 18%, transparent);
}
.phone__screen {
  background: var(--bg);
  width: 100%; height: 100%;
  border-radius: 36px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.phone__notch {
  position: absolute;
  top: 14px; left: 50%;
  transform: translateX(-50%);
  width: 100px; height: 26px;
  background: var(--ink);
  border-radius: 999px;
  z-index: 5;
}
.phone__hero {
  padding: 60px 22px 22px;
  flex: 0 0 auto;
}
.phone__hero .balance {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: .6;
  font-weight: 600;
}
.phone__hero .pts {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 48px;
  letter-spacing: -0.04em;
  line-height: 1;
  margin-top: 4px;
}
.phone__qr {
  margin: 14px 22px;
  flex: 1;
  background: var(--white);
  border: 1.5px solid var(--ink);
  border-radius: 22px;
  display: grid;
  place-items: center;
  position: relative;
}
.phone__qr .qr {
  width: 70%;
  aspect-ratio: 1;
  background-image:
    linear-gradient(var(--ink), var(--ink)),
    linear-gradient(var(--ink), var(--ink)),
    linear-gradient(var(--ink), var(--ink)),
    linear-gradient(var(--ink), var(--ink));
  background-size: 22% 22%, 22% 22%, 22% 22%, 100% 100%;
  background-repeat: no-repeat;
  background-position: 0 0, 100% 0, 0 100%, 0 0;
  background-color: var(--white);
  position: relative;
}
.phone__qr .qr::after {
  content: "";
  position: absolute;
  inset: 28%;
  background:
    radial-gradient(circle, var(--ink) 0 4px, transparent 5px) 0 0 / 22% 22%,
    radial-gradient(circle, var(--ink) 0 4px, transparent 5px) 50% 50% / 22% 22%;
}
.phone__qr .label {
  position: absolute;
  bottom: 14px; left: 14px; right: 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: center;
  opacity: .55;
}
.phone__nav {
  display: flex;
  justify-content: space-around;
  padding: 14px 22px 28px;
  border-top: 1.5px solid var(--ink);
}
.phone__nav span {
  width: 26px; height: 26px;
  border: 1.5px solid var(--ink);
  border-radius: 8px;
  background: transparent;
}
.phone__nav span:nth-child(1) { background: var(--pop); }

/* FAQ section */
.faq-grid {
  display: grid;
  grid-template-columns: 0.7fr 1.3fr;
  gap: clamp(32px, 5vw, 72px);
  margin-top: clamp(20px, 3vw, 32px);
}
.faq-grid h2 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(40px, 5vw, 80px);
  line-height: 0.95;
  letter-spacing: -0.035em;
  margin: 16px 0 0;
}

/* CTA banner */
.cta-banner {
  background: var(--bg-alt);
  text-align: center;
}
.cta-banner h2 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(48px, 8vw, 140px);
  line-height: 0.9;
  letter-spacing: -0.045em;
  margin: 0 0 28px;
  text-wrap: balance;
}

/* Footer */
.footer {
  background: var(--ink);
  color: var(--bg);
  padding-block: clamp(60px, 7vw, 100px) 40px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1.3fr;
  gap: 32px;
  align-items: start;
}
.footer h4 {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: .55;
  margin: 0 0 18px;
}
.footer ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.footer ul a { color: var(--bg); text-decoration: none; opacity: .8; }
.footer ul a:hover { opacity: 1; }
.footer .newsletter form {
  display: flex;
  border: 1.5px solid var(--bg);
  border-radius: var(--r-pill);
  overflow: hidden;
  background: color-mix(in srgb, var(--bg) 8%, transparent);
}
.footer .newsletter input {
  flex: 1;
  background: transparent;
  border: 0;
  padding: 14px 18px;
  color: var(--bg);
  font: inherit;
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
}
.footer .newsletter input::placeholder { color: color-mix(in srgb, var(--bg) 50%, transparent); }
.footer .newsletter button {
  background: var(--bg);
  color: var(--ink);
  border: 0;
  padding: 0 22px;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.footer__mega {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(120px, 22vw, 360px);
  line-height: 0.82;
  letter-spacing: -0.06em;
  margin-top: clamp(40px, 6vw, 80px);
  color: var(--bg);
}
.footer__mega .dot {
  display: inline-block;
  width: 0.18em; height: 0.18em;
  background: var(--pop);
  border-radius: 50%;
  margin-left: 0.05em;
  transform: translateY(-0.05em);
}
.footer__base {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid color-mix(in srgb, var(--bg) 20%, transparent);
  font-size: 13px;
  opacity: .65;
  flex-wrap: wrap;
}

/* Responsive */
@media (max-width: 960px) {
  .how-grid { grid-template-columns: 1fr; }
  .places { grid-template-columns: 1fr 1fr; }
  .stats { grid-template-columns: 1fr 1fr; gap: 32px 16px; }
  .app-grid { grid-template-columns: 1fr; }
  .faq-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .nav__links { display: none; }
  .hero__art { display: none; }
  .hero__sticker { display: none; }
  .hero__sub-row { grid-template-columns: 1fr; align-items: start; }
}
@media (max-width: 560px) {
  .places { grid-template-columns: 1fr; }
